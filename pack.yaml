ref: jira
label: "Jira"
description: "Actions and polling events for Jira Cloud and Jira Server/Data Center"
version: "0.1.0"
author: "Attune"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: integration
  documentation_url: "https://github.com/attune-packs/jira"
  repository_url: "https://github.com/attune-packs/jira"
  source_version: "3.3.0"
  license: "Apache-2.0"

tags:
  - jira
  - atlassian
  - integration

runtime_deps:
  - python

dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
