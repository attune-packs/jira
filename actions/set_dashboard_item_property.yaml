ref: jira.set_dashboard_item_property
label: "Set Jira Dashboard Item Property"
description: "Create or replace a Jira dashboard gadget property"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: jira_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "jira.credentials", description: "Pack-owned Jira credential Key ref"}
  dashboard_id: {type: string, required: true}
  item_id: {type: string, required: true}
  property_key: {type: string, required: true}
  value: {type: object, required: true}
output:
  operation: {type: string, required: true}
  result: {type: object, description: "Dashboard item property"}
tags: [jira, dashboard, write]
