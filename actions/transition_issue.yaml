ref: jira.transition_issue
label: "Transition Jira Issue"
description: "Transition a Jira issue by transition ID"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: jira_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "jira.credentials", description: "Pack-owned Jira credential Key ref"}
  issue_key: {type: string, required: true}
  transition: {type: string, required: true}
  fields: {type: object}
output:
  operation: {type: string, required: true}
  result: {type: object, description: "Transition status and Jira response"}
tags: [jira, issue, transition, write]
