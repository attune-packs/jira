ref: jira.get_dashboard_item_property_keys
label: "Get Jira Dashboard Item Property Keys"
description: "List property keys for a Jira dashboard gadget"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: jira_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "jira.credentials", description: "Pack-owned Jira credential Key ref"}
  dashboard_id: {type: string, required: true}
  item_id: {type: string, required: true}
output:
  operation: {type: string, required: true}
  result: {type: array, description: "Dashboard item property keys"}
tags: [jira, dashboard, read]
