ref: jira.create_issue
label: "Create Jira Issue"
description: "Create a Jira issue"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: jira_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "jira.credentials", description: "Pack-owned Jira credential Key ref"}
  summary: {type: string, required: true}
  type: {type: string, required: true, default: Task}
  description: {type: string}
  project: {type: string, description: "Overrides default_project in the credential Key"}
  extra_fields: {type: object, description: "Merged last and may override standard Jira fields"}
output:
  operation: {type: string, required: true}
  result: {type: object, description: "Created issue"}
tags: [jira, issue, write]
